name: Trip reminders

# Every day at 8:00 am Arizona time (15:00 UTC; Arizona has no daylight saving), email each traveler the checklist
# items that come due for their upcoming trips (scripts/send_reminders.py). Can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install python-dotenv==1.2.4
      - name: Send reminders
        env:
          AZ_STORE_REPO: ${{ secrets.AZ_STORE_REPO }}
          AZ_STORE_TOKEN: ${{ secrets.AZ_STORE_TOKEN }}
          AZ_SMTP_USER: ${{ secrets.AZ_SMTP_USER }}
          AZ_SMTP_PASSWORD: ${{ secrets.AZ_SMTP_PASSWORD }}
        run: |
          if [ -z "$AZ_STORE_REPO" ] || [ -z "$AZ_SMTP_USER" ]; then
            echo "Storage or email secrets aren't set yet (see DEPLOY.md) - nothing to do."
            exit 0
          fi
          python scripts/send_reminders.py
