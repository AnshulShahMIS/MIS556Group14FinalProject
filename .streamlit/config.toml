[runner]
# Don't interrupt a running plan when a new message arrives; it is queued instead.
fastReruns = false

[server]
# Security hardening
enableXsrfProtection = true     # block cross-site form/websocket forgery
enableCORS = true               # only same-origin requests
enableStaticServing = false     # no public static folder
maxUploadSize = 1               # the app takes no uploads
maxMessageSize = 50             # MB, caps oversized websocket messages
headless = true

[client]
showErrorDetails = "none"       # never show tracebacks (paths, values) to visitors
toolbarMode = "viewer"          # hide developer menu / deploy button from visitors
showSidebarNavigation = false

[browser]
gatherUsageStats = false        # no telemetry to Streamlit

[theme]
# Trip-planner look: serif headings, rounded cards, terracotta accent. Light by default; visitors can switch to
# dark with the "Dark mode" button at the top right (or the menu: Settings > theme).
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:wght@600&display=swap, serif"
baseRadius = "0.75rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#B4532A"
backgroundColor = "#FBF7F2"
secondaryBackgroundColor = "#F5F0EA"
textColor = "#2A2420"
borderColor = "#EADFD3"
linkColor = "#8A3E1F"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#E07A4B"
backgroundColor = "#171412"
secondaryBackgroundColor = "#2A2421"
textColor = "#F3ECE4"
borderColor = "#3A322D"
linkColor = "#F0A27A"

[theme.dark.sidebar]
backgroundColor = "#1F1B18"
